<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Scheme Assignment</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f9;
        }

        table {
            width: 100%;
            max-width: 800px;
            border-collapse: collapse;
            margin: 0 auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            background-color: #ffffff;
        }

        th, td {
            border: 1px solid #cccccc;
            padding: 15px;
            text-align: center;
        }

        /* Header styling to differentiate scheme name */
        th {
            font-family: 'Georgia', serif;
            font-size: 24px;
            font-weight: bold;
            font-style: italic;
            letter-spacing: 1.5px;
            background-color: #1a1a2e;
            color: #ffffff;
        }

        /* Custom text styling for light background contrast */
        .dark-text {
            color: #000000;
            font-weight: bold;
        }

        .light-text {
            color: #ffffff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <table>
        <thead>
            <tr>
                <th colspan="4">Deep Space Nebula</th>
            </tr>
        </thead>
        <tbody>
            <!-- Color Name Row with background colors -->
            <tr>
                <td style="background-color: #0B3D91;" class="light-text">Cosmic Blue</td>
                <td style="background-color: #8A2BE2;" class="light-text">Nebula Purple</td>
                <td style="background-color: #FF69B4;" class="dark-text">Starlight Pink</td>
                <td style="background-color: #00FFFF;" class="dark-text">Cyan Glow</td>
            </tr>
            
            <!-- Hex Values Row -->
            <tr>
                <td>#0B3D91</td>
                <td>#8A2BE2</td>
                <td>#FF69B4</td>
                <td>#00FFFF</td>
            </tr>

            <!-- RGB Values Row -->
            <tr>
                <td>rgb(11, 61, 145)</td>
                <td>rgb(138, 43, 226)</td>
                <td>rgb(255, 105, 180)</td>
                <td>rgb(0, 255, 255)</td>
            </tr>

            <!-- HSL Values Row -->
            <tr>
                <td>hsl(218, 86%, 31%)</td>
                <td>hsl(271, 76%, 53%)</td>
                <td>hsl(330, 100%, 71%)</td>
                <td>hsl(180, 100%, 50%)</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
