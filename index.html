<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Scheme Assignment</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f9;
        }

        table {
            width: 100%;
            max-width: 800px;
            border-collapse: collapse;
            margin: 0 auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            background-color: #ffffff;
        }

        th, td {
            border: 1px solid #cccccc;
            padding: 15px;
            text-align: center;
        }

        th {
            font-family: 'Georgia', serif;
            font-size: 24px;
            font-weight: bold;
            font-style: italic;
            letter-spacing: 1.5px;
            background-color: #1a1a2e;
            color: #ffffff;
        }

        .dark-text {
            color: #000000;
            font-weight: bold;
        }

        .light-text {
            color: #ffffff;
            font-weight: bold;
        }

        /* Styling for the image inside the table */
        .scheme-img {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body>

    <table>
        <thead>
            <tr>
                <th colspan="4">Deep Space Nebula</th>
            </tr>
        </thead>
        <tbody>
            <!-- ADDED IMAGE ROW HERE -->
            <tr>
                <td colspan="4" style="padding: 0;">
                    <img class="scheme-img" src="images (1).jpg" alt="Deep Space Nebula">
                </td>
            </tr>

            <!-- Color Name Row -->
            <tr>
                <td style="background-color: #0B3D91;" class="light-text">Cosmic Blue</td>
                <td style="background-color: #8A2BE2;" class="light-text">Nebula Purple</td>
                <td style="background-color: #FF69B4;" class="dark-text">Starlight Pink</td>
                <td style="background-color: #00FFFF;" class="dark-text">Cyan Glow</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
